version: '3.8'

services:
  # MySQL Database for Guacamole (optimized for Dell Latitude 5340)
  guac-db:
    image: mysql:8.0
    container_name: cybershield-db
    environment:
      MYSQL_ROOT_PASSWORD: cybershield2024
      MYSQL_DATABASE: guacamole_db
      MYSQL_USER: guacamole_user
      MYSQL_PASSWORD: guacamole_pass
    volumes:
      - guac-db-data:/var/lib/mysql
      - ./guacamole/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    networks:
      - guacamole-net
    restart: unless-stopped
    # Resource limits for your 16GB laptop
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Guacamole Server (guacd) - lightweight
  guacd:
    image: guacamole/guacd:latest
    container_name: cybershield-guacd
    networks:
      - guacamole-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Guacamole Web Application
  guacamole:
    image: guacamole/guacamole:latest
    container_name: cybershield-guacamole
    depends_on:
      - guac-db
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: guac-db
      MYSQL_DATABASE: guacamole_db
      MYSQL_USER: guacamole_user
      MYSQL_PASSWORD: guacamole_pass
    ports:
      - "8080:8080"
    networks:
      - guacamole-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Student 1 Lab Environment (lightweight Kali)
  kali-student1:
    build: ./kali-lite
    container_name: cybershield-kali-student1
    hostname: kali-student1
    environment:
      - STUDENT_ID=student1
      - STUDENT_PASSWORD=CyberShield2024!
    networks:
      student1-lab:
        ipv4_address: 10.1.0.10
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - kali1-home:/home/student
    restart: unless-stopped
    # Critical: Resource limits for your 16GB laptop
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  # Lightweight vulnerable target (NOT full Metasploitable2)
  vulnerable-target1:
    build: ./vulnerable-lite
    container_name: cybershield-target-student1
    hostname: vulnerable-target1
    networks:
      student1-lab:
        ipv4_address: 10.1.0.20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Optional Student 2 (only if performance allows)
  kali-student2:
    build: ./kali-lite
    container_name: cybershield-kali-student2
    hostname: kali-student2
    environment:
      - STUDENT_ID=student2
      - STUDENT_PASSWORD=CyberShield2024!
    networks:
      student2-lab:
        ipv4_address: 10.2.0.10
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - kali2-home:/home/student
    restart: unless-stopped
    profiles:
      - optional  # Only start if explicitly requested
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  vulnerable-target2:
    build: ./vulnerable-lite
    container_name: cybershield-target-student2
    hostname: vulnerable-target2
    networks:
      student2-lab:
        ipv4_address: 10.2.0.20
    restart: unless-stopped
    profiles:
      - optional  # Only start if explicitly requested
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

networks:
  guacamole-net:
    driver: bridge
  
  # Isolated lab networks
  student1-lab:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.1.0.0/24
  
  student2-lab:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.2.0.0/24

volumes:
  guac-db-data:
  kali1-home:
  kali2-home:
